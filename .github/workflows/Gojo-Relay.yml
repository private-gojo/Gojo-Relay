# -----------------------------------------------------------------------------
# Pipeline   : Gojo-Relay I/O Container Delivery
# Purpose    : Lints Xray JSONC configs, executes dry-run builds, and pushes
#              multi-tagged images (:latest, :sha) to Docker Hub.
# Triggers   : Push to main branch
# Secrets    : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# -----------------------------------------------------------------------------

name: Build and Push — ⚡ Gojo-Relay I/O

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Retrieve source repository tree
      - name: Checkout
        uses: actions/checkout@v3

      # --------------------------------------------------
      # Pre-flight Linting:
      # Strips actual comments while safely ignoring
      # protocol slashes inside strings (e.g. https://).
      # --------------------------------------------------
      - name: Validate config.json
        run: |
          python3 -c "import json, re; s=open('config.json').read(); json.loads(re.sub(r'(\".*?\"|\'.*?\')|//.*?$|/\*.*?\*/', lambda m: m.group(1) if m.group(1) else '', s, flags=re.MULTILINE|re.DOTALL))" && echo "✅ config.json valid"

      # --------------------------------------------------
      # Dry-run build to verify container context integrity
      # before authenticating to remote registry.
      # --------------------------------------------------
      - name: Test Docker Build
        run: |
          docker build -t gojo-relay-test . && echo "✅ Build OK"

      # Authenticate securely using GitHub Action secrets
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # Multi-tag Deployment:
      # :latest for quick pulls; :sha for immutable pinning
      # and deterministic rollbacks on serverless runtimes.
      # --------------------------------------------------
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gojo-relay-io:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gojo-relay-io:${{ github.sha }}
