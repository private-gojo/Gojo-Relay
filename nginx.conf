# =========================
# WORKER SETTINGS
# Tuned for 1-2 vCPU / 2GiB Cloud Run instances
# =========================
worker_processes auto;
worker_rlimit_nofile 4096;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # =========================
    # LOGGING
    # =========================
    access_log off;
    error_log /dev/stderr warn;

    include mime.types;
    default_type application/octet-stream;

    # =========================
    # OS & SOCKET LEVEL OPTIMIZATIONS
    # =========================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # =========================
    # UPSTREAM CONNECTION KEEP-ALIVE & TIMEOUTS
    # =========================
    keepalive_timeout 3600s;
    keepalive_requests 100000;

    reset_timedout_connection on;
    client_body_timeout 60s;
    send_timeout 60s;

    server_tokens off;

    # =========================
    # PROTOCOL UPSTREAM DEFAULTS
    # =========================
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    server {
        # -------------------------
        # Internal port only - anti_ddos.py (port 8080) is the public-facing
        # edge, nginx no longer listens on 8080 directly
        # -------------------------
        listen 8082 backlog=4096;
        server_name _;

        # -------------------------
        # Restores the real client IP forwarded by anti_ddos.py so
        # $remote_addr here isn't just 127.0.0.1 for every request
        # -------------------------
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # =========================
        # FRONTEND WEB PANEL ROOT
        # =========================
        location = / {
            root /var/lib/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
            access_log off;
        }

        # =========================
        # CLIENT STATIC CACHE ASSETS
        # =========================
        location ~* \.(css|js|ico|png|jpg|svg|woff2?)$ {
            root /var/lib/nginx/html;
            expires 1h;
            access_log off;
        }

        # =========================
        # RUNTIME METRICS & CORE STATE
        # =========================
        location = /runtime.json {
            alias /etc/xray/runtime.json;
            add_header Content-Type application/json;
            add_header Cache-Control no-cache;
        }

        # =========================
        # DYNAMIC SUBSCRIPTION HANDLER
        # =========================
        location = /go {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            access_log off;
        }

        # =========================
        # VLESS WEBSOCKET TUNNEL INGRESS
        # =========================
        location ~ ^/gojo/infinity-limitless/ {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Stream Buffering Bypass & Socket Tuning
            proxy_buffering off;
            proxy_buffer_size 8k;
            proxy_buffers 4 16k;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            proxy_cache_bypass $http_upgrade;

            # Persistent Session Timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        # =========================
        # SERVICE HEALTH CHECK PROBE
        # =========================
        location = /health {
            return 200 'ok';
            add_header Content-Type text/plain;
            access_log off;
        }
    }
}
