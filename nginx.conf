worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    include mime.types;
    default_type application/octet-stream;

    # =========================
    # KERNEL NETWORK TUNING
    # =========================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # =========================
    # PERSISTENT SESSION TIMEOUTS
    # =========================
    keepalive_timeout 3600s;
    keepalive_requests 100000;
    reset_timedout_connection on;
    client_body_timeout 60s;
    send_timeout 60s;

    server_tokens off;

    # =========================
    # REAL CLIENT IP PROPAGATION
    # =========================
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 8080 backlog=4096;
        server_name _;

        # =========================
        # WEB PANEL UI ENDPOINT
        # =========================
        location = / {
            root /var/lib/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
            access_log off;
        }

        # =========================
        # STATIC ASSETS CACHING
        # =========================
        location ~* \.(css|js|ico|png|jpg|svg|woff2?)$ {
            root /var/lib/nginx/html;
            expires 1h;
            access_log off;
        }

        # =========================
        # RUNTIME DIAGNOSTICS ENDPOINT
        # =========================
        location = /runtime.json {
            alias /etc/xray/runtime.json;
            add_header Content-Type application/json;
            add_header Cache-Control no-cache;
        }

        # =========================
        # DYNAMIC SUBSCRIPTION SERVICE (PROXY TO PYTHON)
        # =========================
        location = /sub {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            access_log off;
        }

        # =========================
        # VLESS WEBSOCKET ZERO-BUFFER TUNNEL
        # =========================
        location /gojo/infinity-limitless/ {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;

            # WebSocket Handshake Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            # Client Identity Forwarding
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Low-Latency Stream Buffering Bypass
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            proxy_cache_bypass $http_upgrade;

            # Long-Lived Tunnel Timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        # =========================
        # CLOUD RUN HEALTH PROBE
        # =========================
        location = /health {
            return 200 'ok';
            add_header Content-Type text/plain;
            access_log off;
        }
    }
}
