[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
silent=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/null
stderr_logfile=/dev/null
priority=1

[program:xray]
command=xray -config /etc/xray/config.json
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/null
stderr_logfile=/dev/null
priority=2
