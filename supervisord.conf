# =========================
# SUPERVISORD CORE SETTINGS
# =========================
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
silent=false

# =========================
# ANTI-DDOS FORTRESS (Public edge proxy, port 8080)
# Sits in front of Nginx - filters L7 floods before they reach
# Nginx (8082) or Xray (10001)
# =========================
[program:anti_ddos]
command=sh /wait-for-nginx.sh
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

# =========================
# NGINX (Reverse Proxy / Web Panel)
# Uses wait-for-xray.sh wrapper instead of direct nginx command
# to avoid startup race condition with Xray. Now listens internally
# on 8082, behind anti_ddos.py
# =========================
[program:nginx]
command=sh /wait-for-xray.sh
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2

# =========================
# XRAY (VLESS/VMess/Trojan/SS Core Engine)
# =========================
[program:xray]
command=xray -config /etc/xray/config.json
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=3

# =========================
# SUB_SERVER (Dynamic Subscription Link Generator - Python, port 8081)
# =========================
[program:sub_server]
command=python3 /sub_server.py
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=4
